name: PR Security & Mergeability Monitor

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:          # manual trigger for testing

permissions:
  contents: write   # needed to commit updated state.json
  pull-requests: read

jobs:
  monitor:
    name: Run PR monitor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monitor repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_MONITOR_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pr-monitor/package.json

      - name: Install dependencies
        working-directory: pr-monitor
        run: npm ci

      - name: Run monitor
        working-directory: pr-monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GH_MONITOR_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/index.js

      - name: Commit updated state
        run: |
          git config user.name  "pr-monitor[bot]"
          git config user.email "pr-monitor@users.noreply.github.com"
          git add pr-monitor/state.json
          git diff --cached --quiet || git commit -m "chore: update pr-monitor state [skip ci]"
          git push
